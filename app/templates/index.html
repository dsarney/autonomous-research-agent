<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Autonomous Research Agent</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">Research agent</p>
        <h1>Autonomous Research Agent</h1>
      </div>
    </header>
    <div class="workspace">
      <section class="card composer">
        <form id="research-form">
          <div class="composer-grid">
            <div class="composer-query">
              <label for="query">Research question</label>
              <textarea
                id="query"
                name="query"
                minlength="3"
                placeholder="Is the UK electric vehicle market a good opportunity for a new charging company?"
              ></textarea>
            </div>
            <div class="composer-docs">
              <label class="file-label" for="documents">Documents</label>
              <input
                id="documents"
                name="documents"
                class="file-input"
                type="file"
                multiple
                accept=".pdf,.docx,.txt,.md,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown"
              />
              <ul id="file-list" class="file-chips"></ul>
              <p class="hint">PDF, Word, text, or Markdown. Up to 5 files.</p>
            </div>
          </div>
          <div class="actions">
            <button type="submit" id="submit">Run research</button>
            <button type="button" id="stop" disabled>Stop</button>
            <p class="status" id="status"></p>
          </div>
        </form>
      </section>
      <main class="canvas">
        <div id="progress"></div>
        <div id="output"></div>
      </main>
    </div>
    <script src="/static/main.js" defer></script>
  </body>
</html>
